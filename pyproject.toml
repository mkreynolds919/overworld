[project]
name = "overworld"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.15.3",
]

[project.scripts]
overworld = "overworld:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
